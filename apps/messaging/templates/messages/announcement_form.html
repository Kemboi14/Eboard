{% extends "base/base.html" %}

{% block title %}New Announcement - Enwealth E-Board{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow">
            <div class="p-6 border-b">
                <h1 class="text-2xl font-bold text-gray-900">New Announcement</h1>
            </div>
            <div class="p-6">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="space-y-6">
                        <div>
                            <label for="id_title" class="block text-sm font-medium text-gray-700">Title</label>
                            <input type="text" name="title" id="id_title" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500" required>
                        </div>
                        <div>
                            <label for="id_summary" class="block text-sm font-medium text-gray-700">Summary</label>
                            <input type="text" name="summary" id="id_summary" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500">
                        </div>
                        <div>
                            <label for="id_content" class="block text-sm font-medium text-gray-700">Content</label>
                            <textarea name="content" id="id_content" rows="6" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500" required></textarea>
                        </div>
                        <div>
                            <label for="id_target_audience" class="block text-sm font-medium text-gray-700">Target Audience</label>
                            <select name="target_audience" id="id_target_audience" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500">
                                <option value="all">All Users</option>
                                <option value="board">Board Members</option>
                                <option value="committee">Committee Members</option>
                                <option value="branch">Branch Members</option>
                                <option value="custom">Custom</option>
                            </select>
                        </div>
                        <div>
                            <label for="id_priority" class="block text-sm font-medium text-gray-700">Priority</label>
                            <select name="priority" id="id_priority" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500">
                                <option value="normal">Normal</option>
                                <option value="high">High</option>
                                <option value="urgent">Urgent</option>
                            </select>
                        </div>
                        <div>
                            <label for="id_publish_at" class="block text-sm font-medium text-gray-700">Publish At</label>
                            <input type="datetime-local" name="publish_at" id="id_publish_at" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500">
                        </div>
                        <div class="flex justify-end space-x-3">
                            <a href="{% url 'messaging:announcements' %}" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                                Cancel
                            </a>
                            <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition">
                                Create Announcement
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
