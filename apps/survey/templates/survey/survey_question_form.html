{% extends "base/base.html" %}

{% block title %}Add Question{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <a href="{% url 'survey:survey_detail' object.survey.pk %}" class="text-blue-600 hover:text-blue-800">← Back to Survey</a>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">Add Question</h1>

        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Question Text</label>
                    <textarea name="question_text" rows="3" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Question Type</label>
                    <select name="question_type" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="text">Text</option>
                        <option value="single_choice">Single Choice</option>
                        <option value="multiple_choice">Multiple Choice</option>
                        <option value="rating">Rating Scale</option>
                        <option value="yes_no">Yes/No</option>
                        <option value="date">Date</option>
                        <option value="number">Number</option>
                        <option value="comment">Comment/Feedback</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Help Text</label>
                    <textarea name="help_text" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" name="required" id="required" checked class="mr-2">
                    <label for="required" class="text-sm text-gray-700">Required</label>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Order</label>
                    <input type="number" name="order" value="1" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>

                <button type="submit" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700">
                    Add Question
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
