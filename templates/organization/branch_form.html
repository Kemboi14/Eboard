{% extends 'base/base.html' %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="bg-white rounded-xl shadow-sm p-6">
    <h1 class="text-2xl font-bold mb-6" style="color: #2d1b5e;">{{ title }}</h1>
    
    <form method="post" class="space-y-6">
      {% csrf_token %}
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Branch Name *</label>
          <input type="text" 
                 name="name" 
                 required
                 value="{% if branch %}{{ branch.name }}{% endif %}"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                 placeholder="e.g., Nairobi Branch">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Branch Code *</label>
          <input type="text" 
                 name="code" 
                 required
                 value="{% if branch %}{{ branch.code }}{% endif %}"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 uppercase"
                 placeholder="e.g., NAI">
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Country *</label>
          <input type="text" 
                 name="country" 
                 required
                 value="{% if branch %}{{ branch.country }}{% else %}Kenya{% endif %}"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                 placeholder="e.g., Kenya">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">City</label>
          <input type="text" 
                 name="city" 
                 value="{% if branch %}{{ branch.city }}{% endif %}"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                 placeholder="e.g., Nairobi">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
        <textarea name="address" 
                  rows="3"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                  placeholder="Full street address">{% if branch %}{{ branch.address }}{% endif %}</textarea>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
          <input type="text" 
                 name="phone" 
                 value="{% if branch %}{{ branch.phone }}{% endif %}"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                 placeholder="e.g., +254 700 000 000">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input type="email" 
                 name="email" 
                 value="{% if branch %}{{ branch.email }}{% endif %}"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                 placeholder="e.g., nairobi@enwealth.co.ke">
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Branch Type *</label>
          <select name="branch_type" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="regional_office" {% if branch and branch.branch_type == 'regional_office' %}selected{% endif %}>Regional Office</option>
            <option value="headquarters" {% if branch and branch.branch_type == 'headquarters' %}selected{% endif %}>Headquarters</option>
            <option value="country_office" {% if branch and branch.branch_type == 'country_office' %}selected{% endif %}>Country Office</option>
            <option value="subsidiary" {% if branch and branch.branch_type == 'subsidiary' %}selected{% endif %}>Subsidiary Company</option>
            <option value="affiliate" {% if branch and branch.branch_type == 'affiliate' %}selected{% endif %}>Affiliate</option>
            <option value="joint_venture" {% if branch and branch.branch_type == 'joint_venture' %}selected{% endif %}>Joint Venture</option>
            <option value="representative_office" {% if branch and branch.branch_type == 'representative_office' %}selected{% endif %}>Representative Office</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
          <select name="status" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="active" {% if branch and branch.status == 'active' %}selected{% endif %}>Active</option>
            <option value="inactive" {% if branch and branch.status == 'inactive' %}selected{% endif %}>Inactive</option>
            <option value="under_review" {% if branch and branch.status == 'under_review' %}selected{% endif %}>Under Review</option>
            <option value="suspended" {% if branch and branch.status == 'suspended' %}selected{% endif %}>Suspended</option>
          </select>
        </div>
      </div>
      
      <div class="flex justify-end space-x-4">
        <a href="{% if branch %}{% url 'organization:branch_detail' branch.pk %}{% else %}{% url 'organization:branch_list' %}{% endif %}" 
           class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
          Cancel
        </a>
        <button type="submit" 
                class="px-6 py-2 rounded-lg text-white font-medium"
                style="background-color: #7dc143;"
                onmouseover="this.style.backgroundColor='#5a8a3c'"
                onmouseout="this.style.backgroundColor='#7dc143'">
          {% if branch %}Update Branch{% else %}Create Branch{% endif %}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
